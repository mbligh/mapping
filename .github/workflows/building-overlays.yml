name: Publish experimental NJ building PMTiles to R2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/building-overlays.yml'
      - 'scripts/r2_pmtiles'
permissions:
  contents: read
concurrency:
  group: building-overlays-r2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate R2 configuration
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          : "${R2_ACCOUNT_ID:?Missing R2_ACCOUNT_ID}"
          : "${R2_BUCKET:?Missing R2_BUCKET}"
          : "${R2_PUBLIC_URL:?Missing R2_PUBLIC_URL}"
      - name: Check AWS CLI
        run: aws --version
      - name: Download both retained building datasets
        run: |
          mkdir -p build/trex build/overture
          gh release download trex-extracts --pattern nj_features.pmtiles --dir build/trex
          gh release download overture-buildings-nj-43763373956-1 --pattern nj_overture_buildings.pmtiles --dir build/overture
          test -s build/trex/nj_features.pmtiles
          test -s build/overture/nj_overture_buildings.pmtiles
      - name: Publish independent immutable archives and manifests
        run: |
          python3 scripts/r2_pmtiles build/trex/nj_features.pmtiles \
            --dataset trex-buildings --bucket "$R2_BUCKET" \
            --endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --public-url "$R2_PUBLIC_URL"
          python3 scripts/r2_pmtiles build/overture/nj_overture_buildings.pmtiles \
            --dataset overture-buildings --bucket "$R2_BUCKET" \
            --endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --public-url "$R2_PUBLIC_URL"
      - name: Verify uploaded archives through R2 API
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for name in trex-buildings overture-buildings; do
            key=$(aws --endpoint-url "$endpoint" s3api get-object \
              --bucket "$R2_BUCKET" --key "$name.json" /tmp/"$name".json >/dev/null && \
              python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"].split("/")[-1])' /tmp/"$name".json)
            aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" \
              --key "versions/$key" --query '[ContentLength,ContentType]'
            aws --endpoint-url "$endpoint" s3api get-object --bucket "$R2_BUCKET" \
              --key "versions/$key" --range bytes=0-126 /tmp/"$name".header >/dev/null
            python3 -c 'import sys; assert open(sys.argv[1],"rb").read(7)==b"PMTiles"' /tmp/"$name".header
            echo "Validated $name PMTiles through R2"
          done
