name: Cancel superseded surveillance run
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-superseded-surveillance.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete slow build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/40540862589/cancel
