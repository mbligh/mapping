name: Build surveillance PMTiles
on:
  push:
    branches: [main]
    paths:
      - 'surveillance/**'
      - 'scripts/dataset_releases'
      - 'scripts/r2_pmtiles'
      - 'scripts/test_r2_pmtiles.py'
      - 'scripts/osm_snapshot'
      - '.github/workflows/surveillance.yml'
  schedule:
    - cron: '23 7 * * 0'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh NJ OSM snapshot']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: surveillance-dataset
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check dataset release assembly
        run: |
          python3 scripts/test_dataset_releases
          python3 scripts/test_r2_pmtiles.py
      - name: Test New Jersey surveillance filtering and marker styles
        run: |
          python3 surveillance/scripts/test_build_geojsonseq.py
          python3 surveillance/scripts/test_osm_camera_points
          node surveillance/scripts/test_markers.mjs
      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe osmium-tool
          tippecanoe --version
      - name: Convert ArcGIS JSON to GeoJSON sequence
        run: |
          mkdir -p build build/output
          python3 surveillance/scripts/build_geojsonseq surveillance/flocksurveillance -o build/flock.geojsonseq
      - name: Diagnose known NJ location in source data
        run: |
          python3 surveillance/scripts/nearest build/flock.geojsonseq --lat 40.72542 --lon -74.77641
      - name: Download retained New Jersey OSM snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/osm_snapshot download build/new-jersey.osm.pbf
      - name: Filter New Jersey OpenStreetMap data
        run: |
          osmium tags-filter build/new-jersey.osm.pbf \
            nwr/man_made=surveillance nwr/highway=speed_camera \
            nwr/highway=red_light_camera nwr/surveillance=red_light \
            nwr/enforcement=traffic_signals nwr/enforcement=maxspeed \
            -o build/osm-cameras.osm.pbf --overwrite
          osmium export build/osm-cameras.osm.pbf \
            -f geojsonseq -o build/osm-cameras.geojsonseq --overwrite
          python3 surveillance/scripts/osm_camera_points \
            build/osm-cameras.geojsonseq build/osm-camera-points.geojsonseq
      - name: Build combined surveillance PMTiles
        run: |
          tippecanoe -o build/output/surveillance.pmtiles -l surveillance \
            -Z 8 -z 15 --no-feature-limit --no-tile-size-limit \
            --drop-rate=1 --base-zoom=8 --force -P \
            build/flock.geojsonseq build/osm-camera-points.geojsonseq
          ls -lh build/output/surveillance.pmtiles
      - name: Upload versioned PMTiles and publish R2 manifest
        if: ${{ vars.R2_ACCOUNT_ID != '' && vars.R2_BUCKET != '' && vars.R2_PUBLIC_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"
          python3 scripts/r2_pmtiles build/output/surveillance.pmtiles \
            --dataset surveillance --bucket "$R2_BUCKET" \
            --endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --public-url "$R2_PUBLIC_URL"
      - name: Publish versioned surveillance release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dataset_releases create surveillance build/output

