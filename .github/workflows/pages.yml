name: Build and publish surveillance tiles
on:
  push:
    branches: [main]
    paths:
      - '**/features_*.json'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
          tippecanoe --version
      - name: Convert ArcGIS JSON to GeoJSON sequence
        run: |
          mkdir -p build public
          python3 scripts/build_geojsonseq . -o build/flock.geojsonseq
      - name: Diagnose known NJ location in source data
        run: |
          python3 scripts/nearest.py build/flock.geojsonseq --lat 40.72542 --lon -74.77641
      - name: Build PMTiles
        run: |
          tippecanoe -o public/flock.pmtiles -l flock -Z 8 -z 15 \
            --no-feature-limit --no-tile-size-limit --drop-rate=1 --base-zoom=8 \
            --force -P build/flock.geojsonseq
          ls -lh public/flock.pmtiles
      - name: Upload PMTiles to Cloudflare R2
        if: ${{ vars.R2_ACCOUNT_ID != '' && vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"
          aws s3 cp public/flock.pmtiles "s3://${R2_BUCKET}/flock.pmtiles" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"
      - name: Prepare Pages site
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          cp site/index.html public/index.html
          if [ -n "${R2_PUBLIC_URL}" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('public/index.html')
          content = path.read_text()
          url = os.environ['R2_PUBLIC_URL'].rstrip('/') + '/flock.pmtiles'
          content = content.replace("new URL('flock.pmtiles', location.href).href", "R2_TILE_URL")
          content = content.replace("'pmtiles://' + R2_TILE_URL", repr('pmtiles://' + url))
          path.write_text(content)
          PY
          fi
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
