name: Build and publish surveillance tiles
on:
  push:
    branches: [main]
    paths:
      - '**/features_*.json'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
          tippecanoe --version
      - name: Convert ArcGIS JSON to GeoJSON sequence
        run: |
          mkdir -p build public
          python3 scripts/build_geojsonseq . -o build/flock.geojsonseq
      - name: Build PMTiles
        run: |
          tippecanoe -o public/flock.pmtiles -l flock -Z 8 -z 15 \
            --no-feature-limit --no-tile-size-limit \
            --force -P build/flock.geojsonseq
          ls -lh public/flock.pmtiles
      - name: Prepare Pages site
        run: |
          cp site/index.html public/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
